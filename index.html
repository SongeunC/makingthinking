<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>토론 수업 도우미</title>
  <script src="js/fresh.js" data-css="css/style.css"></script>
</head>
<body>
  <main class="wrap" id="app">
    <p id="join-loading" class="board-head" style="padding-top:60px">불러오는 중…</p>
    <section id="join-view" hidden>
      <div class="board-head"><h1 class="topic">토론 수업 입장</h1></div>
      <div class="card">
      <form id="join-form" autocomplete="off">
        <label class="field">
          <span>접속 코드</span>
          <input id="code" class="code-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="000000">
        </label>
        <label class="field">
          <span>이름</span>
          <input id="name" maxlength="20" required placeholder="이름을 입력하세요">
        </label>
        <button class="btn btn-primary btn-block" id="join-btn">입장하기</button>
        <p class="error" id="join-error"></p>
      </form>
      </div>
      <p class="small" style="text-align:center;color:var(--chalk-soft)">선생님은 <a href="teacher.html">교사 화면</a>으로 들어가세요.</p>
    </section>

    <section id="room-view" hidden></section>
  </main>
  <script src="js/fresh.js" data-main="js/student.js"></script>
</body>
</html>
