<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>토론 수업 도우미</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap" id="app">
    <section class="card" id="join-view">
      <h1 style="font-size:24px;margin-bottom:16px">토론 수업 입장</h1>
      <form id="join-form" autocomplete="off">
        <label class="field">
          <span>접속 코드</span>
          <input id="code" class="code-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="000000">
        </label>
        <label class="field">
          <span>이름</span>
          <input id="name" maxlength="20" required placeholder="이름을 입력하세요">
        </label>
        <button class="btn btn-primary btn-block" id="join-btn">입장하기</button>
        <p class="error" id="join-error"></p>
      </form>
      <p class="small muted" style="margin-top:20px">선생님은 <a href="teacher.html">교사 화면</a>으로 들어가세요.</p>
    </section>

    <section id="room-view" hidden></section>
  </main>
  <script type="module" src="js/student.js"></script>
</body>
</html>
